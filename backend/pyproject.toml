[project]
name = "aegis-backend"
version = "0.1.0"
description = "Aegis — Autonomous AI DevOps Engineer, backend API and agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

# Agent runtime. Kept optional so a plain `pip install -e .` stays fast while
# the orchestration code is still being built out.
# boto3 and the GitHub client enter this extra at their own stages.
agent = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "mcp>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]